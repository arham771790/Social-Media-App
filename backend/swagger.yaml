openapi: 3.0.0
info:
  title: Lovable Dev Platform API
  version: 1.0.1
  description: |
    API docs for the developer-centric social platform backend.

servers:
  - url: http://localhost:4000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string, example: "a1b2c3d4-..." }
        username: { type: string }
        email: { type: string }
        avatar: { type: string, format: url }
        bio: { type: string }
        isPublic: { type: boolean }
    Post:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        aiDescription: { type: string, example: "AI-generated summary (optional)" }
        type: { type: string, enum: [post, blog, thread, text, image, video], example: "blog" }
        tags: { type: array, items: { type: string } }
        mediaUrl: { type: string }
        thumbnailUrl: { type: string }
        isAnonymous: { type: boolean }
        isPublic: { type: boolean }
        author: { $ref: '#/components/schemas/User' }
        parentPostId: { type: string, nullable: true }
        replies: 
          type: array
          items: { $ref: '#/components/schemas/Post' }
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        author: { $ref: '#/components/schemas/User' }
        postId: { type: string }
        parentId: { type: string, nullable: true }
        replies:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        createdAt: { type: string, format: date-time }
    Tag:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    Story:
      type: object
      properties:
        id: { type: string }
        user: { $ref: '#/components/schemas/User' }
        mediaUrl: { type: string }
        type: { type: string, enum: [image, video] }
        caption: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        isPublic: { type: boolean }

paths:
  # --- Auth ---
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        201:
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        400: { description: Validation error }
        409: { description: User already exists }

  /auth/login:
    post:
      summary: User login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        200:
          description: JWT token + user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        401: { description: Invalid credentials }

  /auth/logout:
    post:
      summary: User logout (stateless)
      tags: [Auth]
      responses:
        200: { description: Success message }

  # --- User/Profile ---
  /users/me:
    get:
      summary: Get current user profile
      tags: [User]
      security: [ { bearerAuth: [] } ]
      responses:
        200:
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401: { description: Unauthorized }

    put:
      summary: Update current user's profile
      tags: [User]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avatar: { type: string, format: url }
                bio: { type: string }
                isPublic: { type: boolean }
      responses:
        200:
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400: { description: Invalid input }
        401: { description: Unauthorized }

  /users/me/settings:
    get:
      summary: Get user settings
      tags: [User]
      security: [ { bearerAuth: [] } ]
      responses:
        200:
          description: User settings
        401: { description: Unauthorized }

    put:
      summary: Update user settings
      tags: [User]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                darkMode: { type: boolean }
                notificationEmail: { type: boolean }
                notificationPush: { type: boolean }
                showActivityStatus: { type: boolean }
                language: { type: string }
                privacyProfile: { type: boolean }
                privacyLastSeen: { type: boolean }
      responses:
        200: { description: Updated settings }
        400: { description: Invalid input }
        401: { description: Unauthorized }

  /users/{id}:
    get:
      summary: Get public user profile by ID
      tags: [User]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404: { description: Not found }

  # --- Posts/Blogs/Threads ---
  /posts:
    post:
      summary: Create a post/blog/thread
      tags: [Posts]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, type]
              properties:
                title: { type: string }
                content: { type: string }
                type: { type: string, enum: [blog, post, thread, text, image, video] }
                tags: { type: array, items: { type: string } }
                mediaUrl: { type: string }
                thumbnailUrl: { type: string }
                isAnonymous: { type: boolean }
      responses:
        201: { description: Created }
        400: { description: Validation error }
        401: { description: Unauthorized }

    get:
      summary: List posts/blogs/threads
      tags: [Posts]
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
        - in: query
          name: author
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        200:
          description: List of posts/blogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  /posts/{id}:
    get:
      summary: Get a post/blog/thread by ID
      tags: [Posts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Post found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        404: { description: Not found }

    put:
      summary: Update a post/blog/thread
      tags: [Posts]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                tags: { type: array, items: { type: string } }
                mediaUrl: { type: string }
                thumbnailUrl: { type: string }
                isAnonymous: { type: boolean }
      responses:
        200: { description: Updated }
        400: { description: Validation error }
        401: { description: Unauthorized }
        403: { description: Not allowed }
        404: { description: Not found }

    delete:
      summary: Delete a post/blog/thread
      tags: [Posts]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Deleted }
        401: { description: Unauthorized }
        403: { description: Not allowed }
        404: { description: Not found }

  /posts/{id}/like:
    post:
      summary: Like a post/blog/thread
      tags: [Posts]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Liked }
        401: { description: Unauthorized }

  /posts/{id}/bookmark:
    post:
      summary: Bookmark a post/blog/thread
      tags: [Posts]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Bookmarked }
        401: { description: Unauthorized }

  /posts/{id}/share:
    post:
      summary: Share a post/blog/thread
      tags: [Posts]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Shared }
        401: { description: Unauthorized }

  /posts/{id}/reply:
    post:
      summary: Reply to a post/thread
      tags: [Posts]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                isAnonymous: { type: boolean }
                mediaUrl: { type: string }
      responses:
        201: { description: Created }
        400: { description: Validation error }
        401: { description: Unauthorized }

  # --- Comments (nested, on posts) ---
  /posts/{postId}/comments:
    post:
      summary: Add a comment or reply to a comment (nested)
      tags: [Comments]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                parentId: { type: string, nullable: true, description: "If set, this is a reply to a comment" }
      responses:
        201: { description: Created }
        400: { description: Validation error }
        401: { description: Unauthorized }

    get:
      summary: Get all comments (nested) for a post
      tags: [Comments]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: List of comments (nested)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

  # --- Messaging ---
  /messages/{chatGroupId}:
    get:
      summary: Get messages for a chat thread
      tags: [Messages]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: chatGroupId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: List of messages }
        401: { description: Unauthorized }
    post:
      summary: Send a message to a chat thread
      tags: [Messages]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: chatGroupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                mediaUrl: { type: string }
      responses:
        201: { description: Created }
        401: { description: Unauthorized }

  # --- Notifications ---
  /notifications:
    get:
      summary: List current user's notifications
      tags: [Notifications]
      security: [ { bearerAuth: [] } ]
      responses:
        200: { description: List of notifications }
        401: { description: Unauthorized }
    post:
      summary: Send a notification (server/internal use)
      tags: [Notifications]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId, type, message]
              properties:
                recipientId: { type: string }
                type: { type: string }
                message: { type: string }
                relatedUserId: { type: string }
                relatedPostId: { type: string }
      responses:
        201: { description: Created }
        401: { description: Unauthorized }
  /notifications/{id}/read:
    post:
      summary: Mark a notification as read
      tags: [Notifications]
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Updated }
        401: { description: Unauthorized }

  # --- AI ---
  /ai/generate-tags:
    post:
      summary: Generate tags (placeholder)
      tags: [AI]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        200: { description: OK }
        401: { description: Unauthorized }
  /ai/suggest-captions:
    post:
      summary: Suggest captions (placeholder)
      tags: [AI]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        200: { description: OK }
        401: { description: Unauthorized }

  # --- Health ---
  /health:
    get:
      summary: Healthcheck
      tags: [System]
      responses:
        200: { description: OK }

  # --- Stories (Sample) ---
  /stories:
    post:
      summary: Create a story
      tags: [Stories]
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaUrl, type]
              properties:
                mediaUrl: { type: string }
                type: { type: string, enum: [image, video] }
                caption: { type: string }
      responses:
        201: { description: Created }
        400: { description: Validation error }
        401: { description: Unauthorized }

    get:
      summary: List all stories
      tags: [Stories]
      responses:
        200:
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Story'
  
  # --- Tags ---
  /tags:
    get:
      summary: List all tags
      tags: [Tags]
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Filter tags by name
      responses:
        200:
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }

    post:
      summary: Create a new tag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "ai" }
      responses:
        201: { description: Tag created }
        409: { description: Tag already exists }
        400: { description: Invalid input }
